# Testea y publica las tres imágenes (amd64 + arm64) en ghcr.io.
#   push a main  → :latest y :sha-xxxxxxx
#   tag vX.Y.Z   → :X.Y.Z, :X.Y y :latest
name: images

on:
  push:
    branches: [main, v1]
    tags: ["v*"]
  pull_request:
  # Permite lanzar una build a mano desde la pestaña Actions, sin tener que
  # crear un tag ni hacer un commit vacío.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go vet ./...
      - run: go test ./...

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: |
          for t in api node agent; do docker build -q --target $t -t wgrelay-$t:dev .; done
          test/e2e/run.sh

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: e2e
    strategy:
      matrix:
        target: [api, node, agent]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wg-relay-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
