# ==============================================================================
# Ingress L7: sensorhub (sensorhub.andy.net.ar)
# IP VPN Asignada: 10.10.1.4
# ==============================================================================

server {
    listen 80;
    server_name sensorhub.andy.net.ar *.sensorhub.andy.net.ar;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl;
    http2 on;
    server_name sensorhub.andy.net.ar *.sensorhub.andy.net.ar;

    ssl_certificate     /etc/letsencrypt/live/sensorhub.andy.net.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sensorhub.andy.net.ar/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 64M;

    location / {
        proxy_pass http://10.10.1.4:80;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
