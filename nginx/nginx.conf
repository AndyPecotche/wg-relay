user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

# ==============================================================================
# Módulo HTTP (Layer 7: Reverse Proxy Web / APIs / WebSockets)
# ==============================================================================
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Optimización de I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Formato de Logs JSON/Estructurado para monitoreo
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Configuración de compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml+rss application/atom+xml image/svg+xml;

    # Soporte para WebSockets (Connection Upgrade)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Parámetros SSL Globales recomendados (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_HTTP:10m;
    ssl_session_tickets off;

    # Inclusión dinámica y modular de Virtual Hosts HTTP/HTTPS
    include /etc/nginx/conf.d/*.conf;
}

# ==============================================================================
# Módulo Stream (Layer 4: TCP / UDP / SNI / MQTTS Reverse Proxy)
# ==============================================================================
stream {
    log_format stream_routing '$remote_addr [$time_local] '
                              '$protocol $status $bytes_sent $bytes_received '
                              '$session_time "$upstream_addr"';

    access_log /var/log/nginx/stream_access.log stream_routing;

    # Inclusión dinámica y modular de Proxies Layer 4 (MQTTS, RAW TCP, etc.)
    include /etc/nginx/stream.d/*.conf;
}
