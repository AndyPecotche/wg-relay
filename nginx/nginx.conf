user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

# ==============================================================================
# Módulo Stream (Layer 4: Universal SNI Preread Multiplexer en Puerto 443)
# ==============================================================================
# Escucha en el puerto público 443 para TODO el tráfico TLS entrante.
# Inspecciona el Server Name Indication (SNI) del handshake TLS sin desencriptar:
# - Si el hostname coincide con un servicio TCP (ej. mqtt.*, tcp.*, db.*),
#   se desvía a su respectivo terminador TLS en stream.d/.
# - Por defecto (default), se desvía al motor HTTP interno (127.0.0.1:8443)
#   para servir tráfico Web/HTTPS.
# ==============================================================================
stream {
    log_format stream_multiplex '$remote_addr [$time_local] '
                                '$protocol $status $bytes_sent $bytes_received '
                                '$session_time "$upstream_addr" '
                                'SNI: "$ssl_preread_server_name"';

    access_log /var/log/nginx/stream_access.log stream_multiplex;

    # Mapa dinámico modular: carga las reglas SNI de cada proyecto
    map $ssl_preread_server_name $target_backend {
        include /etc/nginx/stream.d/*.map;
        default 127.0.0.1:8443; # Motor Web HTTP interno por defecto
    }

    # Entrada pública única en puerto 443 para todo el tráfico TLS
    server {
        listen 443;
        ssl_preread on;
        proxy_pass $target_backend;
        proxy_timeout 1h;
        proxy_connect_timeout 10s;
    }

    # Inclusión modular de servicios TCP internos (stream.d/*.conf)
    include /etc/nginx/stream.d/*.conf;
}

# ==============================================================================
# Módulo HTTP (Layer 7: Reverse Proxy Web / APIs / WebSockets)
# ==============================================================================
# Atiende el tráfico HTTP plano en puerto 80 (para redirección a HTTPS)
# y recibe el tráfico HTTPS en el puerto interno 8443 despachado por el multiplexor.
# ==============================================================================
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml+rss application/atom+xml image/svg+xml;

    # Soporte para WebSockets
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Parámetros SSL globales
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_HTTP:10m;
    ssl_session_tickets off;

    # --------------------------------------------------------------------------
    # Servidores por defecto (Bloqueo Estricto de Escaneos por IP o URLs No Válidas)
    # --------------------------------------------------------------------------
    # 1. Bloqueo en puerto 80: si la petición entra por IP directa o con un dominio
    #    no registrado, se corta la conexión TCP inmediatamente sin responder (444).
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # 2. Bloqueo en HTTPS (127.0.0.1:8443): si la conexión TLS no coincide con un
    #    dominio exacto configurado, rechaza el handshake TLS de raíz.
    #    No envía certificados ni responde a escáneres.
    server {
        listen 127.0.0.1:8443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    # Inclusión modular de Virtual Hosts HTTP/HTTPS
    include /etc/nginx/conf.d/*.conf;
}
