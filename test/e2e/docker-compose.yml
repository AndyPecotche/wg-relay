# Entorno de prueba de punta a punta. Lo usa test/e2e/run.sh.
name: wgrelay-e2e
services:
  postgres:
    image: postgres:17-alpine
    environment: [POSTGRES_USER=wgrelay, POSTGRES_PASSWORD=wgrelay, POSTGRES_DB=wgrelay]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "wgrelay"], interval: 1s, retries: 30}

  api:
    image: wgrelay-api:dev
    environment:
      WGRELAY_DATABASE_URL: postgres://wgrelay:wgrelay@postgres/wgrelay
      WGRELAY_BASE_DOMAIN: clients.e2e.test
      WGRELAY_EDGE_HOST: edge.e2e.test
      # mockcf imita la API de Cloudflare y sirve DNS: habilita el endpoint
      # de DNS-01 delegado (F1b) sin tocar una cuenta real.
      CLOUDFLARE_API_TOKEN: dummy
      CLOUDFLARE_ZONE_ID: e2e
      CLOUDFLARE_API_BASE_URL: http://mockcf:8080/client/v4
    depends_on: {postgres: {condition: service_healthy}}

  # Imita la API de Cloudflare (escribe TXT) y sirve un DNS de juguete que
  # Pebble usa para validar DNS-01, sin tocar una cuenta real ni el DNS
  # público (nuestro dominio de prueba clients.e2e.test no existe ahí).
  mockcf:
    image: golang:1-alpine
    working_dir: /src
    volumes:
      - "./mockcf:/src:ro"
      - "gomod_cache:/go/pkg/mod"
    command: ["go", "run", "."]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/healthz"]
      interval: 1s
      retries: 60

  node:
    image: wgrelay-node:dev
    environment:
      WGRELAY_API_URL: http://api:8080
      WGRELAY_NODE_TOKEN: ${NODE_TOKEN:-}
      WGRELAY_HTTPS_LISTEN: ":8443"
      WGRELAY_HTTP_LISTEN: ":8080"
      WGRELAY_DEBUG: "1"
    ports: ["127.0.0.1:18443:8443", "127.0.0.1:18080:8080"]
    networks:
      default:
        # Pebble resuelve los hostnames de terminate por DNS de Docker y tiene
        # que llegar al nodo, que es quien escucha el :8443.
        aliases:
          - "${TERMINATE_HOST:-sin-configurar.invalid}"
          - "${TERMINATE_HOST_TCP:-sin-configurar-tcp.invalid}"
    profiles: [relay]

  # Backend del "cliente": termina TLS él mismo (modo passthrough).
  backend:
    image: alpine:3.20
    command: sh -c "apk add -q openssl && openssl req -x509 -newkey rsa:2048 -nodes -subj /CN=backend -keyout /k -out /c -days 1 2>/dev/null && openssl s_server -quiet -accept 8883 -cert /c -key /k -www"
    profiles: [relay]

  # Servidor ACME de prueba. Valida TLS-ALPN-01 conectandose al :8443 del
  # nodo, que es el mismo camino que recorre el trafico real.
  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    # -dnsserver: para validar DNS-01, en vez del DNS público (nuestro
    # dominio de prueba clients.e2e.test no existe ahí).
    command: ["-config", "/test/config/pebble-config.json", "-dnsserver", "mockcf:8053"]
    environment: [PEBBLE_VA_NOSLEEP=1]
    # El :15000 publica la raiz efimera con la que Pebble firma, para validar
    # desde el host los certificados que emite.
    ports: ["127.0.0.1:15000:15000"]
    volumes: ["./pebble-config.json:/test/config/pebble-config.json:ro"]
    profiles: [relay]

  # Backend HTTP del cliente para el modo terminate (http://).
  webbackend:
    image: traefik/whoami
    profiles: [relay]

  # Backend MQTT del cliente para el modo terminate (tcp://): plano, sin TLS
  # ni certificados propios. El agente termina el TLS delante de él.
  mosquitto:
    image: eclipse-mosquitto:2
    volumes: ["./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
    profiles: [relay]

  # La imagen del agente corre sin privilegios (UID 65532); el volumen de
  # export_cert nace de root, así que hace falta darle permiso una vez.
  certs-init:
    image: busybox
    user: root
    command: ["chown", "-R", "65532:65532", "/certs"]
    volumes: ["exported_certs:/certs"]
    profiles: [relay]

  agent:
    image: wgrelay-agent:dev
    environment:
      WGRELAY_TOKEN: ${AGENT_TOKEN:-}
      WGRELAY_DEBUG: "1"
    volumes:
      - "./wgrelay.yml:/etc/wgrelay/wgrelay.yml:ro"
      - "./minica.pem:/pebble/minica.pem:ro"
      - "exported_certs:/certs"
    depends_on: {certs-init: {condition: service_completed_successfully}}
    profiles: [relay]

  agent2:
    image: wgrelay-agent:dev
    environment:
      WGRELAY_TOKEN: ${AGENT_TOKEN:-}
    volumes:
      - "./wgrelay.yml:/etc/wgrelay/wgrelay.yml:ro"
      - "./minica.pem:/pebble/minica.pem:ro"
      - "exported_certs:/certs"
    profiles: [standby]

volumes:
  exported_certs:
  gomod_cache:
