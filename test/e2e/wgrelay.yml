relay: http://api:8080

# CA de prueba (Pebble) en vez de Let's Encrypt.
acme:
  email: e2e@test
  ca: https://pebble:14000/dir
  trusted_roots: /pebble/minica.pem

routes:
  - host: mqtt
    mode: passthrough
    to: backend:8883
  # Comodín: cubre cualquier subdominio bajo dev.<dominio> sin enumerarlos.
  - host: "*.dev"
    mode: passthrough
    to: backend:8883
  # terminate: el agente saca el certificado y proxea HTTP al servicio.
  - host: web
    to: http://webbackend:80
