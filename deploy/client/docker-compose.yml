# Ejemplo para exponer servicios de un proyecto con wg-relay.
# Copiá este archivo, wgrelay.yml y .env.example a tu proyecto.
services:
  wgrelay:
    # Para probar sin publicar la imagen:
    #   docker build --target agent -t wgrelay-agent:dev /ruta/al/repo/wg-relay
    #   y poné WGRELAY_VERSION=dev con image: wgrelay-agent:${WGRELAY_VERSION}
    image: ghcr.io/andypecotche/wg-relay-agent:${WGRELAY_VERSION:-latest}
    restart: unless-stopped
    environment:
      WGRELAY_TOKEN: ${WGRELAY_TOKEN:?definí WGRELAY_TOKEN en .env}
    volumes:
      - ./wgrelay.yml:/etc/wgrelay/wgrelay.yml:ro
    # El agente se conecta a los destinos de wgrelay.yml por nombre de
    # servicio, así que tiene que estar en la misma red que ellos.
    networks: [app]

networks:
  app:
    name: mi_proyecto_network   # la red de tu proyecto
    external: true
