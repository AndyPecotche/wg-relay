# ==============================================================================
# Plantilla Docker Compose para Nodo Local (Detrás de CGNAT)
# ==============================================================================
# Este stack se levanta en tu servidor local / Raspberry Pi / HomeLab (proyecto1).
# 1. WireGuard conecta tu red local con el VPS Relay (IP: 10.10.1.2).
# 2. Nginx Local recibe el tráfico del VPS en el puerto 80 y lo despacha
#    a tus contenedores o servicios locales según el subdominio.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Cliente WireGuard (Túnel saliente hacia el VPS Relay)
  # ----------------------------------------------------------------------------
  wireguard-client:
    image: linuxserver/wireguard:latest
    container_name: proyecto1-wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      # Monta tu archivo wg0.conf generado por add-peer.sh
      - ./wireguard/wg0.conf:/config/wg0.conf:ro
      - /lib/modules:/lib/modules:ro
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    networks:
      proyecto1_net:
        ipv4_address: 172.30.0.2

  # ----------------------------------------------------------------------------
  # 2. Nginx Local (Ingress del Proyecto: distribuye según el subdominio)
  # ----------------------------------------------------------------------------
  # NOTA DE RED: Nginx local comparte la red con WireGuard o se enruta a través de él.
  # La forma más simple y directa es usar network_mode: "service:wireguard-client"
  # para que Nginx local escuche DIRECTAMENTE en la IP de la VPN (10.10.1.2:80).
  nginx-local:
    image: nginx:alpine
    container_name: proyecto1-nginx-local
    restart: unless-stopped
    network_mode: "service:wireguard-client"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - wireguard-client

  # ----------------------------------------------------------------------------
  # 3. Servicios Locales de Ejemplo
  # ----------------------------------------------------------------------------
  app-web:
    image: traefik/whoami:latest
    container_name: proyecto1-app-web
    restart: unless-stopped
    networks:
      proyecto1_net:
        ipv4_address: 172.30.0.10

  app-api:
    image: traefik/whoami:latest
    container_name: proyecto1-app-api
    restart: unless-stopped
    environment:
      - WHOAMI_NAME=API Microservice
    networks:
      proyecto1_net:
        ipv4_address: 172.30.0.11

networks:
  proyecto1_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
