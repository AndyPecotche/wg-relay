# ==============================================================================
# Nginx LOCAL de proyecto1 (Escucha en 10.10.1.2:80 a través de WireGuard)
# ==============================================================================
# El VPS ya terminó el TLS y te reenvió la petición en HTTP plano con el Host original.
# Aquí defines libremente tus microservicios locales sin tocar el VPS.
# ==============================================================================

# 1. Aplicación Web / Dashboard principal del Proyecto
server {
    listen 80;
    server_name proyecto1.tudominio.com;

    location / {
        proxy_pass http://172.30.0.10:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Microservicio de API de proyecto1
server {
    listen 80;
    server_name api.proyecto1.tudominio.com;

    location / {
        proxy_pass http://172.30.0.11:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
