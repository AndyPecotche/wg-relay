[Interface]
# IP del nodo Relay / Ingress Proxy en la subred de la VPN
Address = 10.10.0.1/16
ListenPort = 51820

# Clave privada del nodo Relay (inyectada automáticamente por assemble.sh desde /config/server.key)
PrivateKey = yCbx/zG6SBqQMYxxH81dCy3gGpP4+LGO5leWzCFhel0=

# ==============================================================================
# Reglas de Firewall (Aislamiento Estricto L3 y Reenvío Seguro)
# ==============================================================================
# 1. BLOQUEO LATERAL: Rechazar cualquier paquete que intente viajar de un peer a otro
PostUp = iptables -I FORWARD -i wg0 -o wg0 -j REJECT
# 2. PERMITIR INGRESO: Permitir tráfico desde el contenedor Nginx (eth0) hacia la VPN (wg0)
PostUp = iptables -A FORWARD -i eth0 -o wg0 -j ACCEPT
# 3. PERMITIR RETORNO: Permitir tráfico de respuesta ya establecido desde los peers hacia eth0
PostUp = iptables -A FORWARD -i wg0 -o eth0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
# 4. MASQUERADE: Enmascarar IP origen para garantizar que las respuestas vuelvan a 10.10.0.1
PostUp = iptables -t nat -A POSTROUTING -o wg0 -j MASQUERADE

# Reglas de limpieza al bajar la interfaz
PreDown = iptables -D FORWARD -i wg0 -o wg0 -j REJECT
PreDown = iptables -D FORWARD -i eth0 -o wg0 -j ACCEPT
PreDown = iptables -D FORWARD -i wg0 -o eth0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
PreDown = iptables -t nat -D POSTROUTING -o wg0 -j MASQUERADE


